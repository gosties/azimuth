[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h3search"
version = "0.13.4"
description = "Spatial search and bounded table ingestion"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[project.scripts]
h3search = "h3search.etl.cli:main"
azimuth-export-worker = "h3search.api.export_worker:main"
azimuth-export-migrate = "h3search.api.export_migrate:main"
azimuth-clean-slate = "h3search.clean_slate:main"

[project.optional-dependencies]
etl = ["pyodbc==5.3.0"]
native-etl = ["pyodbc==5.3.0", "arrow-odbc==10.7.1"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"h3search" = ["data/*.json"]
"h3search.api" = ["documents/*.html", "*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120

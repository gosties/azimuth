services:
  cache-init:
    image: azimuth-web:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    user: '0:0'
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    entrypoint: [sh, -c, 'mkdir -p /cache/parquet-pages-256kb-v1 && chown 1000:1000 /cache /cache/parquet-pages-256kb-v1']
    mem_limit: 64m
    cpus: 1
    volumes:
      - trino-cache:/cache
  trino:
    image: azimuth-trino:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.trino
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    depends_on:
      cache-init:
        condition: service_completed_successfully
    ports:
      - "${TRINO_BIND_ADDRESS:-127.0.0.1}:${TRINO_PORT:-8096}:8080"
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/node.properties:/etc/trino/node.properties:ro
      - ./trino/resource-groups.properties:/etc/trino/resource-groups.properties:ro
      - ./trino/resource-groups.json:/etc/trino/resource-groups.json:ro
      - ./trino/access-control.properties:/etc/trino/access-control.properties:ro
      - ./trino/access-control.json:/etc/trino/access-control.json:ro
      - ./trino/cache.properties:/etc/trino/cache/alluxio.properties:ro
      - ./private/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
      - trino-cache:/data/trino/cache
    mem_limit: ${TRINO_MEMORY_LIMIT:-24g}
    cpus: ${TRINO_CPU_LIMIT:-16}
    healthcheck:
      test: [CMD, /usr/lib/trino/bin/health-check]
      interval: 15s
      timeout: 5s
      retries: 20
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    env_file:
      - ./private/api.env
    volumes:
      - api-runtime:/app/runtime
    mem_limit: 2g
    cpus: 4
    depends_on:
      trino:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
  export-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    command: [python, -m, h3search.api.export_worker]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    env_file:
      - ./private/api.env
    volumes:
      - api-runtime:/app/runtime
    mem_limit: ${EXPORT_MEMORY_LIMIT:-2g}
    cpus: ${EXPORT_CPU_LIMIT:-2}
    depends_on:
      trino:
        condition: service_healthy
  web:
    image: azimuth-web:local
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    environment:
      AZIMUTH_MAP_SOURCES: ${AZIMUTH_MAP_SOURCES:-https://a.tile.opentopomap.org https://basemap.nationalmap.gov https://gibs.earthdata.nasa.gov https://server.arcgisonline.com https://tile.openstreetmap.org}
      AZIMUTH_TRUSTED_TUNNEL_IP: ${AZIMUTH_TRUSTED_TUNNEL_IP:-127.0.0.1}
      AZIMUTH_TRUSTED_LOOPBACK_IP: ${AZIMUTH_TRUSTED_LOOPBACK_IP:-::1}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8156}:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 256m
volumes:
  trino-cache:
  api-runtime:

services:
  control-db:
    image: postgres:17.11-alpine3.24@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    restart: unless-stopped
    environment:
      POSTGRES_DB: h3search
      POSTGRES_USER: h3search
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD:?required}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CONTROL_DB_PORT:-5563}:5432"
    volumes:
      - control-data:/var/lib/postgresql/data
    mem_limit: 768m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U h3search -d h3search"]
      interval: 10s
      timeout: 5s
      retries: 10
  catalog-db:
    image: postgres:17.11-alpine3.24@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    restart: unless-stopped
    environment:
      POSTGRES_DB: iceberg
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:?required}
    volumes:
      - catalog-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U iceberg -d iceberg"]
      interval: 10s
      timeout: 5s
      retries: 10
  object-store:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: [server, /data, --console-address, ':9001']
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?required}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${S3_PORT:-9160}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9161}:9001"
    volumes:
      - object-data:/data
    mem_limit: 2g
  catalog:
    image: tabulario/iceberg-rest:1.6.0
    restart: unless-stopped
    depends_on:
      catalog-db:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?required}
      AWS_REGION: us-east-1
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://catalog-db:5432/iceberg
      CATALOG_JDBC_USER: iceberg
      CATALOG_JDBC_PASSWORD: ${CATALOG_DB_PASSWORD:?required}
      CATALOG_WAREHOUSE: ${ICEBERG_WAREHOUSE:-s3://h3search/warehouse}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://object-store:9000
      CATALOG_S3_PATH__STYLE__ACCESS: 'true'
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CATALOG_PORT:-8186}:8181"
    mem_limit: 2g
volumes:
  control-data:
  catalog-data:
  object-data:
